<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Arkana — Magos Battle Royale (v0.1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Chakra+Petch:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #05070f; overflow: hidden;
      /* mobile: sem pull-to-refresh, sem seleção/callout de long-press */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #app { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: auto; touch-action: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // bloqueia o menu de contexto (long-press mobile / botão direito = tática)
    window.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
