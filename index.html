<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Arkana — Magos Battle Royale (v0.1)</title>
  <style>
    /* ------------------------------------------------------------------
       Tipografia EMPACOTADA (public/fonts) — nenhuma chamada de rede.
       Regra: o protótipo não faz UMA requisição externa sequer, o que
       mantém a resposta "nenhuma coleta" na ficha de Segurança de Dados
       e faz o jogo abrir idêntico em modo avião (GDD §19.6).
       Subconjunto "latin" (U+0000-00FF + pontuação geral) — cobre todo o
       pt-BR do jogo. Licenças: public/fonts/OFL.txt (SIL OFL 1.1).
       Cinzel e Inter são variáveis: um arquivo serve todos os pesos.
       ------------------------------------------------------------------ */
    @font-face {
      font-family: 'Cinzel'; font-style: normal; font-weight: 500; font-display: block;
      src: url(./fonts/cinzel-latin.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Cinzel'; font-style: normal; font-weight: 700; font-display: block;
      src: url(./fonts/cinzel-latin.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Chakra Petch'; font-style: normal; font-weight: 400; font-display: block;
      src: url(./fonts/chakra-petch-400-latin.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Chakra Petch'; font-style: normal; font-weight: 700; font-display: block;
      src: url(./fonts/chakra-petch-700-latin.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: block;
      src: url(./fonts/inter-latin.woff2) format('woff2');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; background: #05070f; overflow: hidden;
      /* mobile: sem pull-to-refresh, sem seleção/callout de long-press */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #app { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: auto; touch-action: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // bloqueia o menu de contexto (long-press mobile / botão direito = tática)
    window.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
