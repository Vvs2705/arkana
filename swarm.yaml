version: "1.0"
project: "ARKANA"
default_topology: "hierarchical"
max_subagents_per_wave: 4

rules:
  - "design/ e' a fonte da verdade; muda la' primeiro, implementa depois."
  - "Nao commitar binarios 3D/texturas pesadas fora do Git LFS."
  - "Portao: testes do Unity Test Framework em -batchmode antes de qualquer entrega."
  - "Todo teste novo se prova reintroduzindo o defeito; se nao fica vermelho, e' decorativo."

lanes:
  unity_core:
    owner: "enterprise-architect"
    helpers:
      - "test-writer"
      - "code-reviewer"
    scope:
      - "mobile-unity/Assets/_Arkana/Scripts/Core"
      - "mobile-unity/Assets/_Arkana/Tests"

  unity_gameplay:
    owner: "enterprise-architect"
    helpers:
      - "qa-test-automation"
      - "simplificador"
    scope:
      - "mobile-unity/Assets/_Arkana/Scripts/Gameplay"
      - "mobile-unity/Assets/_Arkana/Scenes"

  art_direction:
    owner: "product-ux-conversion"
    helpers:
      - "documentador"
    scope:
      - "arte"
      - "design/gdd/ART.md"
      - "design/gdd/ROADMAP_3D.md"
