; Preset de export Android — dono: raia MUNDO (contrato em ARQUITETURA.md).
; Debug APK assinado com o debug.keystore (convencao publica do Android).
; PROIBIDO adicionar preset de release aqui sem ordem do Diretor.
; Orientacao landscape vem de project.godot (display/window/handheld/orientation=4).
; min SDK: o Godot 4.4.1 REJEITA min_sdk customizado sem gradle build (testado
; 19/08). O template pre-compilado embute minSdk 21 — superset de 24: instala em
; todo aparelho que um minSdk 24 instalaria. Ao ligar use_gradle_build (G6,
; plugins), setar gradle_build/min_sdk="24" aqui.

